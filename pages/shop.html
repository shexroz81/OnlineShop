<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop</title>
    <link rel="stylesheet" href="../css/shop.css" />
    <link rel="website icon" type="png" href="../images/Icon-removebg-preview.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header>
      <div class="sub-header">
        <div class="sub-header-container">
          <div class="sub-text">
            <h4>High Quality Products & Services</h4>
          </div>
          <div class="social">
            <i class="fa-brands fa-facebook"></i>
            <i class="fa-brands fa-twitter"></i>
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-pinterest"></i>
            <i class="fa-brands fa-telegram"></i>
          </div>
        </div>
      </div>
      <div class="navbar">
        <div class="navbar-container">
          <div class="logo">
            <h1>Online Shop</h1>
            <img src="./images/Icon-removebg-preview.png" alt="" />
          </div>
          <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="#">About</a>
            <a href="#">Best Deals</a>
            <a href="#">Contact Us</a>
            <a href="./pages/shop.html">Shop</a>
          </div>
          <div class="call">
            <i class="fa-solid fa-phone"></i>
            <span>Call Us: +998 90 123 4567</span>
          </div>
          <div class="bars" id="bar">
            <i class="fa-solid fa-bars"></i>
          </div>
        </div>
        <div class="mobile-menu" id="mobile-menu">
          <div class="mobile-close">
            <span>Close</span>
            <i class="fa-solid fa-xmark"></i>
          </div>
          <div class="mobile-text">
            <div class="text-one"><h3>Pages</h3></div>
            <div class="text-two" id="category-btn"><h3>Categories</h3></div>
          </div>
          <div class="mobile-links" id="mobile-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Best Deals</a>
            <a href="#">Contact Us</a>
            <a href="./pages/shop.html">Shop</a>
          </div>
          <div class="categories-link" id="categories-link">
            <a href="#">Category 1</a>
            <a href="#">Category 2</a>
            <a href="#">Category 3</a>
            <a href="#">Category 4</a>
            <a href="#">Category 5</a>
          </div>
        </div>
      </div>
      <section id="products"></section>
    </header>
    <script src="../js/shop.js"></script>
  </body>
</html>
