<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop</title>
    <link rel="stylesheet" href="../css/shop.css" />
    <link rel="website icon" type="png" href="../images/Icon-removebg-preview.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header>      <div class="sub-header">
        <div class="sub-header-container">
          <div class="sub-text">
            <h4>High Quality Products & Services</h4>
          </div>

          <div class="social">
            <i class="fa-brands fa-facebook"></i>
            <i class="fa-brands fa-twitter"></i>
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-pinterest"></i>
            <i class="fa-brands fa-telegram"></i>
          </div>
        </div>
      </div>

      <nav class="navbar">
        <div class="navbar-container">
          <div class="logo">
            <a>Online Shop</a>
            <img
              src="../images/Icon-removebg-preview.png"
              alt="Online Shop Logo"
            />
          </div>

          <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="./shop.html">Shop</a>
            <a href="./BestDeals.html">Best Deals</a>
            <a href="./Organic.html">Organic Vegetables & Fruits</a>
            <a href="./Order.html">Orders</a>
            <a href="./contact.html">Contact Us</a>
          </div>

          <div class="call">
            <i class="fa-solid fa-phone"></i>
            <span>
              <b>Call To:</b> <br>
              <a href="#">+998 00 000 00 00</a>
            </span>
          </div>

        </div>
      </nav>
    </header>
    <section id="searchbar">
      <div class="searchbar-container">
        <div class="dropdown">
          <div class="dropdown-toggle">
            <i class="fa-solid fa-bars"></i>
            <span>All Departments</span>
            <i class="fa-solid fa-angle-up"></i>
          </div>
          <ul class="dropdown-menu">
            <li><a href="./BestDeals.html">Best Deals</a></li>
            <li><a href="#">Bread</a></li>
            <li><a href="#">Deals</a></li>
            <li><a href="#">Juices</a></li>
            <li><a href="#">Organic</a></li>
            <li><a href="./Organic.html">Organic Vegetables & Fruits</a></li>
          </ul>
        </div>
        <div class="search-input">
          <input type="text" placeholder="Search products..." />
          <button type="submit">
            <i class="fa-solid fa-search"></i>
          </button>
        </div>
        <div class="header-icons">
          <div class="icon-item">
            <i class="fa-solid fa-user"></i>
          </div>
          <div class="icon-item">
            <i class="fa-solid fa-heart"></i>
          </div>
          <div class="icon-item">
            <i class="fa-solid fa-shopping-cart" id="cart"></i>
            <span class="cart-count" id="cart-count">0</span>
          </div>
          <div class="icon-item">
            <button id="toggle"><i class="fa-solid fa-moon"></i></button>
          </div>
        </div>
      </div>
    </section>
      <section id="products"></section>
    </header>
    <script src="../js/shop.js"></script>
  </body>
</html>
